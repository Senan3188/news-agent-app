services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: news
      POSTGRES_DB: news_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set OLLAMA_MODEL in .env}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env (use db as hostname)}
      MEMORY_RECENT_TURNS: ${MEMORY_RECENT_TURNS:-5}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-180}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-12}
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
